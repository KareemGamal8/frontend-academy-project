<!doctype html>
<html>
  <head>
    <title>About</title>
    <style>

      * {
        padding: 0;
        margin: 0;
      }

      header {
        background-color: #f2efef;
        height: 70px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 40px;
        gap: 24px;
      }

      .logo {
        color: #7c3aed;
        font-size: 24px;
        font-weight: 800;
      }

      nav {
        display: flex;
        gap: 16px;
        align-items: center;
      }

      nav a {
        color: #64748b;
        font-size: 20px;
        font-weight: 500;
      }

      a {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h3 class="logo">Frontend Academy</h3>
      <nav>
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Contact</a>
        <button>Start Learning</button>
      </nav>
    </header>
  </body>
</html>
